<!DOCTYPE html>
<html>
    <head>
        <base href="/ammortamento/"> 
        <meta charset="UTF-8">
        <title>Calcolatore piano di ammortamento</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body> 
    <!-- Il form usa il metodo POST che permette di inviare dati al server-->
    <!-- action esplicita la destinazione dei dati dopo il submit-->
        <form method="POST" action="index.php" id="form">

        <div class = "div">
        <label>Inserire l'importo (in €)</label>
        <input type = "number" id = "importo" min = "0.01" step = "0.01" name = "importo" required>
        </div>

        <div>
        <label>Inserire Il numero di rate</label>
        <input type ="number" id ="rate" min = "1" step ="1" name ="rate" required>
        </div>

        <div>
        <label>Inserire il tasso di interesse annuo (in %)</label>
        <input type ="number" id ="interesse" min = "0.01" step ="0.01" name ="interesse" required>
        </div>

        <div>
        <label>Inserire il tipo di ammortamento</label>
        <select name = "tipo" id = "selettore_tipo">
            <option value = "francese">Francese</option>
            <option value = "italiano">Italiano</option>
        </select> 
        </div>

        <button type = "submit">Calcola</button>
        </form>

    </body>
</html>
