<!DOCTYPE html>
<html>
    <head>
        <base href="/ammortamento/"> 
        <meta charset="UTF-8">
        <title>Calcolatore piano di ammortamento</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body> 
    <!-- Il form usa il metodo POST che permette di inviare dati al server-->
    <!-- action esplicita la destinazione dei dati dopo il submit-->
        <form method="POST" action="index.php" id="form">

        <div class = "div">
        <label>Inserire l'importo in €</label>
        <input type="number" id="importo" step="any" name="importo" required>
        </div>

        <div class = "div">
        <label>Inserire Il numero di rate</label>
        <input type="number" id="rate" step="any" name="rate" required>
        </div>

        <label>Frequenza rate</label>
        <select name="frequenza_rate" id="selettore_frequenza_rate" >
            <option value="settimanale">Settimanale</option>
            <option value="mensile">Mensile</option>
            <option value="bimestrale">Bimestrale</option>
            <option value="trimestrale">Trimestrale</option>
            <option value="semestrale">Semestrale</option>
        </select> 
        <br><br>

        <div class = "div">
        <label>Inserire il tasso di interesse annuo (in %)</label>
        <input type="number" id="interesse" step="any" name="interesse" required>
        </div> 

        <div class = "div">
        <label>Inserire il tipo di ammortamento</label>
        <select name="tipo" id="selettore_tipo">
            <option value="francese">Francese</option>
            <option value="italiano">Italiano</option>
        </select> 
        </div>

        <button type="submit">Calcola</button>
        </form>

    </body>
</html>
